<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GOLD'S GYM</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <div class="card-cadastro">
        <h1>Informações para Cadastro</h1>
        
        <form id="formCadastro">
            <div class="grupo-input">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="grupo-input">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>

            <div class="grupo-input">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="grupo-input">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" required placeholder="00000-000">
            </div>

            <div class="grupo-input">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
            </div>

            <div class="grupo-input">
                <label for="senha">Crie uma senha:</label>
                <input type="password" id="senha" required placeholder="Sua senha segura">
            </div>

            <button type="submit" class="btn-enviar">Finalizar Cadastro</button>
        </form>

        <p><a href="index.html">Voltar para a página inicial</a></p>
    </div>
<script src="app.js"></script>
</body>
</html>
